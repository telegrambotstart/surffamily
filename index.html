<!doctype html>
<html lang="en" class="theme_dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram: Launch @surffamilynewbot</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- App links (same behavior as Telegram) -->
  <meta property="al:ios:app_store_id" content="686449807">
  <meta property="al:ios:app_name" content="Telegram Messenger">
  <meta property="al:ios:url" content="tg://resolve?domain=surffamilynewbot">
  <meta property="al:android:url" content="tg://resolve?domain=surffamilynewbot">
  <meta property="al:android:app_name" content="Telegram">
  <meta property="al:android:package" content="org.telegram.messenger">
  <meta name="apple-itunes-app" content="app-id=686449807, app-argument: tg://resolve?domain=surffamilynewbot">

  <style>
    :root {
      color-scheme: dark;
      --bg:#0e1621;
      --panel:#17212b;
      --muted:rgba(255,255,255,.65);
      --text:#fff;
      --accent:#2aabee;
      --accent2:#229ed9;
      --border:rgba(255,255,255,.10);
    }
    html, body { height:100%; }
    body {
      margin:0;
      font-family:-apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }

    /* Telegram-like soft patterned background (lightweight, no canvas) */
    .bg {
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 20% 15%, rgba(42,171,238,.22), transparent 45%),
        radial-gradient(circle at 80% 35%, rgba(109,215,160,.12), transparent 45%),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,.06), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
      pointer-events:none;
    }
    .wrap {
      min-height:100%;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:22px 14px 28px;
      box-sizing:border-box;
    }
    .card {
      width:min(560px, 100%);
      background: var(--panel);
      border-radius:16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.40);
      border:1px solid var(--border);
      overflow:hidden;
    }
    .head {
      display:flex;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
    }
    .logo {
      width:28px; height:28px; border-radius:50%;
      background: var(--accent);
      display:grid; place-items:center;
      font-weight:800;
      letter-spacing:.5px;
      flex:0 0 auto;
    }
    .brand {
      font-weight:700;
      font-size:14px;
      color:rgba(255,255,255,.92);
    }
    .content {
      padding:18px 16px 16px;
    }
    .row {
      display:flex;
      gap:14px;
      align-items:center;
    }
    .avatar {
      width:56px; height:56px; border-radius:50%;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      display:grid; place-items:center;
      font-weight:800;
      flex:0 0 auto;
    }
    .title {
      margin:0;
      font-size:18px;
      line-height:1.2;
      font-weight:800;
    }
    .desc {
      margin:6px 0 0;
      color: var(--muted);
      font-size:14px;
      line-height:1.35;
    }
    .btn {
      display:block;
      width:100%;
      margin-top:16px;
      padding:14px 16px;
      border-radius:12px;
      border:0;
      background: var(--accent);
      color:#fff;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      text-align:center;
    }
    .btn:active { transform: translateY(1px); }
    .fine {
      margin-top:10px;
      color: rgba(255,255,255,.55);
      font-size:12px;
      line-height:1.35;
    }
    .fine a {
      color:#8fd3ff;
      text-decoration:none;
    }
    .fine a:hover { text-decoration:underline; }
    .hint {
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;
      color: rgba(255,255,255,.78);
      line-height:1.35;
      display:none;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="logo">✈︎</div>
        <div class="brand">Telegram</div>
      </div>

      <div class="content">
        <div class="row">
          <div class="avatar">SF</div>
          <div>
            <h1 class="title">Launch @surffamilynewbot</h1>
            <div class="desc">You can contact @surffamilynewbot right away.</div>
          </div>
        </div>

        <button class="btn" id="openBtn">Open in Telegram</button>

        <div class="hint" id="inappHint">
          Вы открыли ссылку во встроенном браузере Instagram/Facebook.
          Если видите белый экран — нажмите <b>Open in browser</b> и повторите.
        </div>

        <div class="fine">
          Если Telegram не открылся, используйте веб-ссылку:
          <a id="webLink" href="https://t.me/surffamilynewbot">https://t.me/surffamilynewbot</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const bot = "surffamilynewbot";
      const tgDeep = `tg://resolve?domain=${bot}`;
      const tgWeb  = `https://t.me/${bot}`;

      const ua = navigator.userAgent || "";
      const isMetaInApp = /Instagram|FBAN|FBAV|FBIOS|FB_IAB/i.test(ua);

      // show hint for Meta in-app browsers
      if (isMetaInApp) {
        document.getElementById("inappHint").style.display = "block";
      }

      // open on user gesture (most reliable on iOS)
      document.getElementById("openBtn").addEventListener("click", () => {
        window.location.href = tgDeep;
        // fallback to web after a moment (helps when deep-link is blocked)
        setTimeout(() => { window.location.href = tgWeb; }, 1200);
      });
    })();
  </script>
</body>
</html>
